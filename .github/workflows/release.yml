name: Prepare Mini release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable firmware version (X.Y.Z)'
        required: true
      publish:
        description: 'Publish the tested build and promote its wireless update manifest'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mini-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and release source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node -e 'if(!/^\d{1,5}\.\d{1,5}\.\d{1,5}$/.test(process.env.VERSION)||process.env.VERSION.split(".").some(n=>Number(n)>65535))process.exit(1)'
          printf '%s' "$VERSION" > firmware/release-version.txt
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/celebration-check.c -lm -o /tmp/celebration-check && /tmp/celebration-check
      - run: node preview/celebration-check.mjs
      - run: node preview/check.mjs && node preview/network-check.mjs
      - run: node tools/generate-assets.mjs --check && node tools/generate-scenes.mjs --check && node tools/build-scenes-tour.mjs --check
      - run: node tools/check-docs.mjs
      - run: node tools/build-library.mjs --check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/policy-check.c -o /tmp/policy-check && /tmp/policy-check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/touch-check.c -o /tmp/touch-check && /tmp/touch-check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/geometry-check.c -lm -o /tmp/geometry-check && /tmp/geometry-check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/portal-check.c -o /tmp/portal-check && /tmp/portal-check
      - run: gcc -std=c11 -Wall -Wextra -Werror tools/parade-check.c -lm -o /tmp/parade-check && /tmp/parade-check
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: firmware
          command: idf.py -DPROJECT_VER=$(cat release-version.txt) build && idf.py merge-bin -o ocean-usb.bin
      - name: Package the board-specific update
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release
          cp firmware/build/ascii_genesis_147.bin release/ascii-genesis-147.bin
          cp firmware/build/ocean-usb.bin release/ocean-usb.bin
          cp release/ocean-usb.bin release/aquarium-usb.bin
          node tools/make-manifest.mjs "$VERSION" release/ascii-genesis-147.bin release/manifest.json
          node tools/make-release-notes.mjs "$VERSION" release/RELEASE-NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-147-${{ inputs.version }}
          path: release/
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: esp32-147-${{ inputs.version }}
          path: release
      - name: Publish immutable version, then promote the ESP32 channel
        run: |
          tag="esp32-147-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already exists. Use a new version number.'
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "ASCII Genesis - Mini v$VERSION" --notes-file release/RELEASE-NOTES.md --latest=false
          if ! gh release view esp32-147-stable >/dev/null 2>&1; then
            gh release create esp32-147-stable --target "$GITHUB_SHA" --title 'ESP32 1.47-inch wireless update channel' --notes 'The manifest points to the current tested ESP32 1.47-inch version. Raspberry Pi is a separate project in Mikepyt87/ascii-genesis.' --latest=false
          fi
          gh release upload esp32-147-stable release/manifest.json --clobber
