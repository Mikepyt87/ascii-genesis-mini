<div id="mini-aquarium-preview">
  <style>
    #mini-aquarium-preview .mini-display { display:block; width:100%; max-width:640px; height:auto; image-rendering:pixelated; margin:16px auto; border-radius:7.5% / 13.9535%; }
    #mini-aquarium-preview .mini-native { max-width:320px; }
    #mini-aquarium-preview .mini-info { color:var(--muted-foreground); }
    #mini-aquarium-preview [hidden] { display:none !important; }
  </style>
  <div class="viz-row">
    <span>ASCII Genesis - Mini · 320 × 172</span>
    <span class="text-small mini-info" data-status aria-live="polite">Browser simulation</span>
  </div>
  <canvas class="mini-display cursor-interaction" width="320" height="172" role="img" aria-label="Animated miniature ASCII ocean with three colored creatures, swaying plants, and bubbles. Tap the water to show touch controls."></canvas>
  <div class="viz-controls">
    <button class="btn btn-primary" type="button" data-action="pause">Pause</button>
    <button class="btn" type="button" data-action="reset">New world</button>
    <button class="btn" type="button" data-action="parade">Parade</button>
    <button class="btn" type="button" data-action="settings">Settings</button>
    <label>Private edition <input type="file" accept="application/json,.json" data-edition></label>
    <button class="btn" type="button" data-dedication hidden>Dedication</button>
    <label>Entrance demo <select data-entrance><option value="0">Balance Angelfish</option><option value="1">Steadfast Marlin</option><option value="2">Spark Wrasse</option></select></label>
    <button type="button" data-demo>Show entrance</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-native><span class="form-check-label">Native pixels</span></label>
  </div>
  <div class="viz-controls" data-network-demo hidden>
    <span class="text-small mini-info">Wi-Fi and update simulation</span>
    <button class="btn" type="button" data-action="connect" hidden>Connect demo home Wi-Fi</button>
    <label class="form-label">Update test<select class="form-select" data-scenario><option value="success">Successful update</option><option value="bad-download">Damaged download</option><option value="bad-boot">Failed restart</option></select></label>
  </div>
  <script src="fish-art.js"></script>
  <script src="font.js"></script>
  <script src="ocean-scenes.js"></script><script src="ocean.js"></script>
  <script src="network.js"></script>
  <script>
    (() => {
      const root = document.getElementById('mini-aquarium-preview');
      const canvas = root.querySelector('canvas'), ctx = canvas.getContext('2d');
      const api = globalThis.MiniAquarium;
      let seed = crypto.getRandomValues(new Uint32Array(1))[0], ocean = new api.MiniOcean(globalThis.AsciiquariumSprites, seed);
      const network = new globalThis.MiniNetwork.MiniNetwork();
      const pause = root.querySelector('[data-action="pause"]');
      const status = root.querySelector('[data-status]');
      let controlsUntil = 8, last = 0, elapsed = 0, privateProfile=null, dedicationOpen=false;
      function drawDedication(){
        ctx.fillStyle='#020c14';ctx.fillRect(0,0,320,172);
        function text(s,x,y,scale=1,color='#bde9e6'){ctx.fillStyle=color;for(let i=0;i<s.length;i++)for(let col=0;col<5;col++)for(let row=0;row<8;row++)if(MiniFont[s.charCodeAt(i)*5+col]&(1<<row))ctx.fillRect(x+(i*6+col)*scale,y+row*scale,scale,scale);}
        text('A NOTE OF THANKS',20,8);text(privateProfile.name,20,24,2,'#73c9ff');
        let at=privateProfile.dedication;for(let row=0;row<8&&at;row++){let len=at.length;if(len>46){len=at.lastIndexOf(' ',46);if(len<=0)len=46;}text(at.slice(0,len),20,44+row*10);at=at.slice(len).trimStart();}
        ctx.fillStyle='#102631';ctx.fillRect(24,124,272,32);text('BACK TO OCEAN',124,136);
      }
      root.querySelector('[data-edition]').addEventListener('change',async e=>{try{const profile=JSON.parse(await e.target.files[0].text());ocean.personalize(profile);privateProfile=profile;root.querySelector('[data-dedication]').hidden=false;dedicationOpen=true;sync();}catch(error){status.textContent=error.message;}});
      root.querySelector('[data-dedication]').addEventListener('click',()=>{dedicationOpen=!dedicationOpen;sync();});
      function draw() {
        root.querySelector('[data-action="parade"]').textContent=ocean.parade?'Return to ocean':'Parade';
        if(dedicationOpen)drawDedication();
        else if(network.screen==='ocean') api.render(ctx, ocean, globalThis.MiniFont);
        else globalThis.MiniNetwork.draw(ctx,network,globalThis.MiniFont);
        root.querySelector('[data-network-demo]').hidden=network.screen==='ocean';
        root.querySelector('[data-action="connect"]').hidden=network.screen!=='setup';
        root.querySelector('[data-scenario]').disabled=network.busy;
        const nextStatus=network.screen==='ocean'?(ocean.paused?'Paused · browser simulation':'Browser simulation'):'Simulated · '+network.message;
        if(status.textContent!==nextStatus)status.textContent=nextStatus;
      }
      function sync() {
        root.querySelector('[data-action="parade"]').textContent=ocean.parade?'Return to ocean':'Parade';
        pause.textContent = ocean.paused ? 'Resume' : 'Pause';
        pause.setAttribute('aria-pressed', String(ocean.paused));
        status.textContent = ocean.paused ? 'Paused · browser simulation' : 'Browser simulation';
        draw();
      }
      function reset() { ocean = new api.MiniOcean(globalThis.AsciiquariumSprites, ++seed); if(privateProfile)ocean.personalize(privateProfile); controlsUntil = elapsed + 8; sync(); }
      function toggle() { ocean.paused = !ocean.paused; controlsUntil = elapsed + 8; ocean.controls = true; sync(); }
      root.querySelector('[data-demo]').addEventListener('click',()=>{
        dedicationOpen=false;network.screen='ocean';ocean.parade=null;ocean.fish=[];ocean.pendingSpawn=null;ocean.paused=false;ocean.controls=false;controlsUntil=0;
        ocean.celebrations=new GenesisCelebrations.Tracker();const name=GenesisCelebrations.names[Number(root.querySelector('[data-entrance]').value)];
        const index=AsciiquariumSprites.findIndex(s=>s.name===name),width=Math.max(...AsciiquariumSprites[index].rows.map(r=>r.length))*6;
        ocean.spawn(index,40,70,1);sync();
      });
      pause.addEventListener('click', toggle);
      root.querySelector('[data-action="reset"]').addEventListener('click', reset);
      function parade(){ocean.toggleParade();controlsUntil=elapsed+8;sync();}
      root.querySelector('[data-action="parade"]').addEventListener('click',parade);
      root.querySelector('[data-action="settings"]').addEventListener('click',()=>{network.open();sync();});
      root.querySelector('[data-action="connect"]').addEventListener('click',()=>{network.connect();sync();});
      root.querySelector('[data-scenario]').addEventListener('change',e=>{network.setScenario(e.target.value);sync();});
      root.querySelector('[data-native]').addEventListener('change', e => canvas.classList.toggle('mini-native', e.target.checked));
      canvas.addEventListener('pointerdown', e => {
        if(dedicationOpen){dedicationOpen=false;sync();return;}
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * api.W / rect.width, y = (e.clientY - rect.top) * api.H / rect.height;
        if(network.screen!=='ocean'){network.action(x,y);sync();}
        else if (ocean.controls && x>=24&&x<296&&((y>=62&&y<100)||(y>=108&&y<146))) {
          if(x<156){if(y<100)toggle();else parade();}
          else if(x>=164){if(y<100)reset();else {network.open();sync();}}
        }
        else { ocean.controls = true; controlsUntil = elapsed + 8; sync(); }
      });
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) ocean.paused = true;
      function frame(now) {
        const dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
        last = now;
        if (!document.hidden) { elapsed += dt; if(!dedicationOpen)ocean.step(dt); network.step(dt); ocean.controls = ocean.paused || elapsed < controlsUntil; draw(); }
        requestAnimationFrame(frame);
      }
      // Exposed read-only snapshots let the preview checks verify real interaction.
      globalThis.miniPreview = {snapshot: () => ({time:ocean.time,paused:ocean.paused,fish:ocean.fish.length,seed:ocean.seed,controls:ocean.controls,parade:ocean.parade?{...ocean.parade}:null,network:{...network}}), reset};
      sync(); requestAnimationFrame(frame);
    })();
  </script>
</div>
